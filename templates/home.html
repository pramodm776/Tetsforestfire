```html
<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Forest Fire Prediction</title>

    <style>
        * {
            box-sizing: border-box;
            font-family: Arial, sans-serif;
        }

        body {
            margin: 0;
            padding: 30px;
            background-color: #f2f2f2;
        }

        .container {
            max-width: 650px;
            margin: auto;
            padding: 30px;
            background-color: white;
            border-radius: 10px;
            border: 1px solid #ddd;
        }

        .header {
            text-align: center;
            margin-bottom: 25px;
        }

        .header .icon {
            font-size: 40px;
        }

        .header h1 {
            margin: 10px 0;
            color: #222;
        }

        .header p {
            color: #666;
        }

        form {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 15px;
        }

        .input-group {
            display: flex;
            flex-direction: column;
        }

        label {
            margin-bottom: 5px;
            font-weight: bold;
            color: #333;
        }

        input {
            padding: 10px;
            border: 1px solid #ccc;
            border-radius: 5px;
            font-size: 14px;
        }

        input:focus {
            outline: none;
            border-color: #1d976c;
        }

        button {
            grid-column: span 2;
            padding: 12px;
            margin-top: 10px;
            border: none;
            border-radius: 5px;
            background-color: #1d976c;
            color: white;
            font-size: 16px;
            cursor: pointer;
        }

        button:hover {
            background-color: #157a58;
        }

        .result {
            margin-top: 25px;
            padding: 15px;
            text-align: center;
            background-color: #e8fff5;
            border: 1px solid #1d976c;
            border-radius: 5px;
        }

        .result h2 {
            margin: 0 0 8px;
            color: #157a58;
        }

        .result p {
            margin: 0;
            font-size: 22px;
            font-weight: bold;
        }

        @media (max-width: 600px) {
            body {
                padding: 15px;
            }

            .container {
                padding: 20px;
            }

            form {
                grid-template-columns: 1fr;
            }

            button {
                grid-column: span 1;
            }
        }
    </style>
</head>

<body>

    <div class="container">

        <div class="header">
            <div class="icon">🔥</div>

            <h1>Forest Fire Prediction</h1>

            <p>
                Enter the environmental parameters
                to predict forest fire conditions.
            </p>
        </div>

        <form action="{{ url_for('predict_datapoint') }}" method="post">

            <div class="input-group">
                <label>Temperature</label>
                <input type="text"
                       name="Temperature"
                       placeholder="Enter Temperature"
                       required>
            </div>

            <div class="input-group">
                <label>Relative Humidity (RH)</label>
                <input type="text"
                       name="RH"
                       placeholder="Enter RH"
                       required>
            </div>

            <div class="input-group">
                <label>Wind Speed (Ws)</label>
                <input type="text"
                       name="Ws"
                       placeholder="Enter Wind Speed"
                       required>
            </div>

            <div class="input-group">
                <label>Rain</label>
                <input type="text"
                       name="Rain"
                       placeholder="Enter Rain"
                       required>
            </div>

            <div class="input-group">
                <label>FFMC</label>
                <input type="text"
                       name="FFMC"
                       placeholder="Enter FFMC"
                       required>
            </div>

            <div class="input-group">
                <label>DMC</label>
                <input type="text"
                       name="DMC"
                       placeholder="Enter DMC"
                       required>
            </div>

            <div class="input-group">
                <label>ISI</label>
                <input type="text"
                       name="ISI"
                       placeholder="Enter ISI"
                       required>
            </div>

            <div class="input-group">
                <label>Classes</label>
                <input type="text"
                       name="Classes"
                       placeholder="Enter Classes"
                       required>
            </div>

            <div class="input-group">
                <label>Region</label>
                <input type="text"
                       name="Region"
                       placeholder="Enter Region"
                       required>
            </div>

            <button type="submit">
                Predict Forest Fire
            </button>

        </form>

        {% if result %}
        <div class="result">
            <h2>The FWI is</h2>
            <p>{{ result }}</p>
        </div>
        {% endif %}

    </div>

</body>

</html>
